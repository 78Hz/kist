# KIST: a physically modelled continuo organ for the M-VAVE FM-1 (fm1-base's tools/build.py)
name = "KIST"
id_prefix = "FM-1_57"           # package identity: dev builds FM-1_5700, releases FM-1_57XXYYZZ
usb_manufacturer = "KIST"
usb_product = "KIST FM-1"
o2 = ["dsp/organ.c", "dsp/tuning.c", "dsp/reverb.c"]   # the engine, compiled at -O2
include = ["dsp", "ui"]
vendored = ["fm1-base/"]        # the platform, a submodule: its checks are its own
ble = false                     # no radio: the organ wants the RAM
cpu2 = true                     # the second core: 2x pipes at the top, the richer room
cpu2_fallback = true            # a unit whose second core misreads goes on with one, until power-off
tagline = "a physically modelled continuo organ"
licence = "MPL-2.0"
author = "KIST contributors"
description = "A four-stop wooden continuo organ, modelled pipe by pipe: Gedackt 8', Rohrflöte 4', Principal 2' and a treble Quint 2 2/3', split bass and treble. Twelve notes, a modelled wind supply with tremulant, historical temperaments and equal divisions, A = 300 to 500.99 Hz, and an algorithmic room."
tags = ["synth"]
