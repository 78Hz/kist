# SPDX-License-Identifier: MPL-2.0
# KIST: every push builds and tests the firmware; a tag vX.Y, or a run by hand with a version, also builds FM-1 Manager for each platform and makes
# the release (the release firmware kist-X.Y.fwsc, firmware.json, the Manager's apps).
name: Build

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release this commit as version X.Y (tag vX.Y): empty for a build only'
        required: false
        default: ''

permissions:
  contents: read

env:
  # the version a release is built as: the tag's, or the one asked for when run by hand; empty for a build only
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.release != '' && format('v{0}', inputs.release) || '') }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow (fm1-base renders its fonts with it)
        run: python3 -m pip install --quiet pillow
      - name: JieLi toolchain and AC79 SDK
        # setup-fm1-toolchain's mirrors (its release assets, checked against their sha256), without its apt step
        env:
          GH_TOKEN: ${{ github.token }}
          SDK: sdk-1.2.14_2026-10-13
          TC: toolchain-20260730.1
        run: |
          set -euo pipefail
          dir="$HOME/.fm1-toolchain"
          mkdir -p "$dir" /tmp/fm1dl
          cd /tmp/fm1dl
          for tag in "$SDK" "$TC"; do
            for attempt in 1 2 3; do
              gh release download "$tag" --repo DimmKirr/setup-fm1-toolchain --clobber \
                --pattern '*.tar.xz' --pattern '*.tar.xz.sha256' && break
              sleep 15
            done
          done
          sha256sum -c ./*.sha256
          for f in ./*.tar.xz; do tar -xJf "$f" -C "$dir"; done
          mv "$dir/sdk" "$dir/AC79_SDK"
          test -d "$dir/toolchain" && test -d "$dir/AC79_SDK"
          echo "JIELI_TOOLCHAIN=$dir/toolchain" >> "$GITHUB_ENV"
          echo "AC79_SDK=$dir/AC79_SDK" >> "$GITHUB_ENV"
      - name: Host simulator and its scripted test
        env:
          CC: gcc                     # the host's compiler: the toolchain's clang (on PATH) has no host headers
        run: |
          set -euo pipefail
          python3 fm1-base/tools/build.py . --host
          build/host/kist_host tests/host/basic.txt build/host
      - name: Engine tests (tuning, temperaments, render)
        env:
          CC: gcc
        run: |
          set -euo pipefail
          tools/build_tools.sh
          build/engine_test
      - name: Firmware
        run: |
          set -euo pipefail
          mkdir -p out
          if [[ -n "$VERSION" ]]; then
            version=${VERSION#v}
            python3 fm1-base/tools/build.py . --release "$version"
            cp "build/kist-$version.fwsc" out/
          else
            python3 fm1-base/tools/build.py .
            cp build/kist.fwsc out/
          fi
          cp build/firmware.json out/
          cp build/host/*.png out/ 2>/dev/null || true
          (cd out && sha256sum *.fwsc firmware.json > SHA256SUMS)
          cat out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/

  manager:
    needs: firmware
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04          # an older glibc: runs on more Linux systems
            asset: fm1-manager-linux-x86_64
          - os: windows-latest
            asset: FM-1-Manager-Windows.exe
          - os: macos-latest          # Apple silicon
            asset: FM-1-Manager-macOS-arm64.zip
          - os: macos-15-intel
            asset: FM-1-Manager-macOS-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: fw
      - name: Linux libraries (Tk, ALSA)
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq tk8.6 libasound2 && exit 0
            sleep 20
          done
          echo "::warning::apt failed: going on with what the runner has"
      - name: Build
        shell: bash
        env:
          FM1M_VERSION: ${{ env.VERSION != '' && env.VERSION || '0.0.0' }}
        run: |
          set -euo pipefail
          mkdir -p manager/firmware
          cp fw/*.fwsc manager/firmware/
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pyinstaller -r manager/requirements.txt
          python -c "import tkinter, mido, rtmidi; print('Tk', tkinter.TkVersion)"
          pyinstaller --noconfirm --distpath dist --workpath pyibuild manager/fm1_manager.spec
          mkdir -p release
          case "$RUNNER_OS" in
            Linux)   cp dist/fm1-manager "release/${{ matrix.asset }}"; exe="dist/fm1-manager" ;;
            Windows) cp "dist/FM-1 Manager.exe" "release/${{ matrix.asset }}"; exe="dist/FM-1 Manager.exe" ;;
            macOS)   ditto -c -k --keepParent "dist/FM-1 Manager.app" "release/${{ matrix.asset }}"
                     exe="dist/FM-1 Manager.app/Contents/MacOS/FM-1 Manager" ;;
          esac
          echo "EXE=$exe" >> "$GITHUB_ENV"
          ls -la release
      - name: Smoke test (the packaged tools answer)
        shell: bash
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: |
          set -euo pipefail
          "$EXE" --tool fm1_install.py --help | tee help.txt
          grep -q "usage: fm1_install.py" help.txt
          "$EXE" --tool fm1_backup.py --help | grep -q "usage: fm1_backup.py"
          if [ "$RUNNER_OS" != Windows ]; then
            "$EXE" --tool flash_tool.py --help | grep -q "usage: flash_tool.py"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: manager-${{ matrix.os }}
          path: release/

  release:
    needs: [firmware, manager]
    if: needs.firmware.result == 'success' && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != ''))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=$VERSION
          version=${tag#v}
          [[ "$version" =~ ^[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{1,2})?(-[A-Za-z0-9]+)?$ ]] || { echo "bad version $version"; exit 1; }
          mkdir files
          cp art/firmware/*.fwsc art/firmware/firmware.json art/firmware/SHA256SUMS files/
          cp art/firmware/console.png files/kist-screen.png 2>/dev/null || true
          find art -path 'art/manager-*' -type f -exec cp {} files/ \;
          ls -la files
          cat > notes.md <<NOTES
          KIST $version for the M-VAVE FM-1, and FM-1 Manager.

          - **kist-$version.fwsc**: the firmware. Install it with FM-1 Manager, or
            \`python3 fm1-base/tools/fm1_install.py kist-$version.fwsc\`.
          - **FM-1 Manager**: macOS (Apple silicon / Intel), Windows, Linux. It installs any FM-1 firmware, puts
            M-VAVE's back, and keeps backups; it comes with this KIST. See [manager/](https://github.com/$GH_REPO/tree/$tag/manager).

          Take a whole-flash backup before the first install (FM-1 Manager → Whole flash). Not yet played on a
          real FM-1: install at your own risk, and report what you find.
          NOTES
          flags=()
          if [[ "$version" == *-* || "$version" == 0.* ]]; then flags=(--prerelease); fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" files/* --clobber
          else                          # (a new tag at this commit, when run by hand)
            gh release create "$tag" files/* --target "$GITHUB_SHA" --title "KIST $version" --notes-file notes.md "${flags[@]}"
          fi
