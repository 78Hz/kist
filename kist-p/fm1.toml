# KIST-P: KIST with a plate reverb in place of the room (fm1-base's tools/build.py kist-p); the organ is KIST's
name = "KIST-P"
id_prefix = "FM-1_59"           # package identity: dev builds FM-1_5900, releases FM-1_59XXYYZZ
usb_manufacturer = "KIST"
usb_product = "KIST-P FM-1"
o2 = ["../dsp/organ.c", "../dsp/tuning.c", "../dsp/plate.c"]   # the engine (the plate for the room), at -O2
o2_cflags = ["-DKIST_PLATE=1"]
include = ["../dsp", "../ui"]
vendored = ["../fm1-base/"]     # the platform, a submodule: its checks are its own
words = "../words.tsv"          # the screen reader's words: KIST's (web/ and docs/ here are links to KIST's)
ble = false                     # no radio: the organ wants the RAM
backup = true                   # the saved setup over USB (tools/fm1_backup.py, the site's backup page)
backup_holds = "the saved setup"
cpu2 = true                     # the second core: 2x pipes at the top, the plate
cpu2_fallback = true            # a unit whose second core misreads goes on with one, until power-off
tagline = "a physically modelled continuo organ, with a plate"
licence = "MPL-2.0"
author = "KIST contributors"
description = "A four-stop wooden continuo organ, modelled pipe by pipe: Gedackt 8', Rohrflöte 4', Principal 2' and a treble Quint 2 2/3', split bass and treble. Twelve notes, a modelled wind supply with tremulant, historical temperaments and equal divisions, A = 300 to 500.99 Hz, and a plate reverb (Dattorro's) with every parameter free."
tags = ["synth"]
repo = "https://github.com/78Hz/kist"
install = "https://github.com/78Hz/kist#kist-p"
screenshot = "docs/img/screen-p.png"
